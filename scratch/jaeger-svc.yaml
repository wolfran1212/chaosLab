apiVersion: v1
kind: Service
metadata:
  name: jaeger-svc
  namespace: otel-lab
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: grpc
      port: 14250
      targetPort: 14250
  type: LoadBalancer
